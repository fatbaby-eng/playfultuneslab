<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toasty the Toaster's Happy Hum</title>
<style>
@font-face { font-family: "Luckiest Guy"; src: url("fonts/LuckiestGuy-Regular.ttf") format("truetype"); }
@font-face { font-family: Shrikhand; src: url("fonts/Shrikhand-Regular.ttf") format("truetype"); }
html, body { margin: 0; background: #141414; height: 100%; }
body { display: flex; flex-direction: column; align-items: center; }
canvas { width: min(100vw, calc((100vh - 72px) * 16 / 9)); height: auto; background: #BEDA25; }
body.render { display: block; background: #BEDA25; }
body.render canvas { width: 1920px; height: 1080px; }
#ui { display: flex; gap: 12px; align-items: center; padding: 10px 12px; width: min(100vw, 960px); box-sizing: border-box; color: #FFF7EA; }
body.render #ui { display: none; }
button, #clock { font-family: "Luckiest Guy", sans-serif; font-size: 22px; }
button { background: #FF4FA3; color: #FFF7EA; border: 4px solid #141414; border-radius: 12px; padding: 4px 16px; cursor: pointer; }
#scrub { flex: 1; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="147" step="0.0417" value="0">
  <span id="clock">0:00</span>
</div>
<audio id="a" src="audio/happy-hum-mix.m4a" preload="auto"></audio>
<script src="film.js"></script>
<script>
const render = new URLSearchParams(location.search).has('render');
if (render) document.body.classList.add('render');
const c = document.getElementById('c');
const ctx = c.getContext('2d', { alpha: false });
const audio = document.getElementById('a');
const scrub = document.getElementById('scrub');
const play = document.getElementById('play');
scrub.max = ToastyFilm.DURATION;
let scrubbing = false;
function paint(editT) {
  try { ToastyFilm.draw(ctx, ToastyFilm.sourceTime(editT || 0)); return ''; }
  catch (e) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#E8372C';
    ctx.fillRect(0, 0, 1920, 1080);
    ctx.fillStyle = '#FFF7EA';
    ctx.font = '28px sans-serif';
    ctx.fillText(String(e && (e.stack || e.message) || e), 40, 80);
    return String(e && e.stack || e);
  }
}
function fmt(t) {
  t = Math.max(0, Math.floor(t || 0));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function loop() {
  if (!scrubbing && audio) {
    paint(audio.currentTime || 0);
    scrub.value = audio.currentTime || 0;
    document.getElementById('clock').textContent = fmt(audio.currentTime);
    play.textContent = audio.paused ? 'Play' : 'Pause';
  }
  if (!render) requestAnimationFrame(loop);
}
play.addEventListener('click', () => { if (audio.paused) audio.play(); else audio.pause(); });
scrub.addEventListener('input', () => {
  scrubbing = true;
  audio.currentTime = +scrub.value;
  paint(audio.currentTime);
  document.getElementById('clock').textContent = fmt(audio.currentTime);
});
scrub.addEventListener('change', () => { scrubbing = false; });
window.renderAt = t => {
  try { ToastyFilm.draw(ctx, t || 0); return ''; }
  catch (e) { return paint(0) || String(e && e.stack || e); }
};
paint(0);
if (!render) loop();
</script>
</body>
</html>
